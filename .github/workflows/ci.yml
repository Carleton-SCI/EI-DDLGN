name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/validate_results.py
      - run: python scripts/reproduce_paper.py --figures-dir build/figures --tables-dir build/tables

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ei-ddlgn-eval
      - run: cargo fmt --all --check --manifest-path crates/ei-ddlgn-eval/Cargo.toml
      - run: cargo test --locked --lib --manifest-path crates/ei-ddlgn-eval/Cargo.toml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag ei-ddlgn:ci .
      - run: docker run --rm ei-ddlgn:ci
